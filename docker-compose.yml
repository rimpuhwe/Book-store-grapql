version: '3.9'
services:
  db:
    image: postgres:16
    container_name: postgres-db
    environment:
      POSTGRES_DB: Bookstore_Management_System
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: raissamich12@gmail.com
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: graphql-springboot
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/Bookstore_Management_System
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: raissamich12@gmail.com
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

volumes:
  postgres_data:
